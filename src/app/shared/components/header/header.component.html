<header class="sticky top-0 z-40 border-b border-line bg-surface/90 backdrop-blur">
  <div class="mx-auto flex h-16 w-full max-w-page items-center justify-between gap-6 px-4 sm:px-6">

    <!-- Logo : monogramme provisoire, à remplacer par le vrai logo de KDLT -->
    <a routerLink="/" class="flex items-center gap-2.5" aria-label="KDLT Éditions, accueil">
      <span class="display flex h-9 w-9 items-center justify-center rounded-[10px] bg-brand-700 text-lg font-semibold text-white">K</span>
      <span class="display text-xl font-semibold leading-none text-ink">KDLT <span class="text-accent-600">Éditions</span></span>
    </a>

    <!-- Onglets (bureau) -->
    <nav class="hidden h-full items-stretch gap-7 md:flex" aria-label="Navigation principale">
      <a routerLink="/" routerLinkActive="!border-brand-600 !text-ink" [routerLinkActiveOptions]="{ exact: true }"
         class="inline-flex items-center border-b-2 border-transparent px-0.5 text-sm font-semibold text-ink-2 transition-colors hover:text-ink">
        Accueil
      </a>
      <a routerLink="/produits" routerLinkActive="!border-brand-600 !text-ink"
         class="inline-flex items-center border-b-2 border-transparent px-0.5 text-sm font-semibold text-ink-2 transition-colors hover:text-ink">
        Produits
      </a>
      <a routerLink="/services" routerLinkActive="!border-brand-600 !text-ink"
         class="inline-flex items-center border-b-2 border-transparent px-0.5 text-sm font-semibold text-ink-2 transition-colors hover:text-ink">
        Services
      </a>
    </nav>

    <!-- Compte (bureau) -->
    <div class="hidden items-center gap-2 md:flex">
      @if (!authService.isLoggedIn()) {
      <a routerLink="/auth/login" class="btn-ghost btn-sm">Connexion</a>
      <a routerLink="/auth/inscription" class="btn-primary btn-sm">Créer un compte</a>
      } @else {
      <div class="relative">
        <button type="button" (click)="toggleMenu()"
                class="flex items-center gap-2 rounded-full border border-line-strong bg-surface py-1 pl-1 pr-3 transition-colors hover:border-ink-3"
                aria-haspopup="menu" [attr.aria-expanded]="menuOpen" aria-label="Menu du compte">
          <span class="avatar h-8 w-8 text-sm">{{ initial }}</span>
          <i class="pi pi-chevron-down text-[10px] text-ink-3"></i>
        </button>

        @if (menuOpen) {
        <div class="animate-fadeIn absolute right-0 top-full z-50 mt-2 w-64 rounded-2xl border border-line bg-surface p-2 shadow-pop" role="menu">
          <div class="px-3 pb-2 pt-2.5">
            <p class="text-2xs font-semibold uppercase tracking-eyebrow text-ink-3">Connecté en tant que</p>
            <p class="truncate text-sm font-semibold text-ink">{{ email }}</p>
          </div>
          <div class="my-1 border-t border-line"></div>

          <a routerLink="/panier" (click)="closeMenu()" class="menu-item">
            <i class="pi pi-shopping-cart menu-icon"></i>Mon panier
          </a>
          <a routerLink="/mes-commandes" (click)="closeMenu()" class="menu-item">
            <i class="pi pi-shopping-bag menu-icon"></i>Mes commandes
          </a>
          <a routerLink="/mes-devis" (click)="closeMenu()" class="menu-item">
            <i class="pi pi-file menu-icon"></i>Mes devis
          </a>
          @if (isStaff) {
          <a routerLink="/admin" (click)="closeMenu()" class="menu-item menu-item-primary">
            <i class="pi pi-chart-bar menu-icon"></i>Administration
          </a>
          }

          <div class="my-1 border-t border-line"></div>
          <button type="button" (click)="logout()" class="menu-item w-full text-danger">
            <i class="pi pi-sign-out menu-icon"></i>Déconnexion
          </button>
        </div>
        }
      </div>
      }
    </div>

  </div>
</header>
