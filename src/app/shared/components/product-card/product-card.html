<a [routerLink]="['/produits', product().slug]" class="card-interactive group flex h-full flex-col overflow-hidden">

  <div class="relative aspect-[4/3] overflow-hidden bg-muted">
    @if (product().imageUrl) {
    <img [src]="product().imageUrl" [alt]="product().name" loading="lazy"
         class="h-full w-full object-cover transition-transform duration-500 ease-out group-hover:scale-[1.03]">
    } @else {
    <div class="flex h-full w-full items-center justify-center text-3xl text-ink-3">
      <i class="pi pi-image"></i>
    </div>
    }
    <span class="badge absolute left-3 top-3 bg-surface text-ink-2 shadow-xs">{{ product().categoryName }}</span>
    @if (product().type === 'CUSTOM') {
    <span class="badge-accent absolute bottom-3 left-3">Sur devis</span>
    }
  </div>

  <div class="flex flex-1 flex-col p-4">
    <h3 class="truncate text-[15px] font-semibold text-ink">{{ product().name }}</h3>
    <p class="mt-1 line-clamp-2 text-sm text-ink-2">{{ product().description }}</p>
    <p class="tabular mt-auto pt-3 text-sm font-semibold text-ink">{{ formatPrice(product().basePrice) }}</p>
  </div>

</a>
