<footer class="mt-20 bg-brand-900 text-white">
  <div class="mx-auto w-full max-w-page px-4 py-12 sm:px-6">
    <div class="grid grid-cols-1 gap-10 md:grid-cols-4">

      <div class="md:col-span-2">
        <p class="display text-2xl font-semibold">KDLT <span class="text-accent-300">Éditions</span></p>
        <p class="mt-3 max-w-md text-sm leading-relaxed text-white/70">
          Imprimer, éditer, valoriser vos idées. Une expertise particulière dans la papeterie médicale
          et les supports professionnels.
        </p>
      </div>

      <div>
        <p class="footer-heading">Navigation</p>
        <ul class="space-y-2.5">
          <li><a routerLink="/produits" class="footer-link">Nos produits</a></li>
          <li><a routerLink="/services" class="footer-link">Nos services</a></li>
        </ul>
      </div>

      <div>
        <p class="footer-heading">Contact</p>
        <!-- Adresse provisoire : à remplacer par la vraie adresse de contact -->
        <a [href]="contactMailto" class="footer-link">{{ contactEmail }}</a>
      </div>

    </div>

    <p class="mt-10 border-t border-white/10 pt-6 text-xs text-white/45">
      © {{ currentYear }} KDLT Éditions Imprimerie. Tous droits réservés.
    </p>
  </div>
</footer>
