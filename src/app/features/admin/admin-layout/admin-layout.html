<div class="page-wide">
  <div class="flex flex-col gap-6 md:flex-row md:gap-8">

    <aside class="md:w-56 md:shrink-0">
      <p class="eyebrow mb-3">Administration</p>

      <nav class="scrollbar-hide -mx-4 flex gap-1 overflow-x-auto px-4 md:mx-0 md:flex-col md:px-0" aria-label="Administration">
        @if (authService.hasRole(Role.OWNER, Role.ADMIN)) {
        <a routerLink="/admin" routerLinkActive="!bg-brand-50 !text-brand-800"
           [routerLinkActiveOptions]="{ exact: true }" class="menu-item shrink-0 whitespace-nowrap">
          <i class="pi pi-chart-bar menu-icon"></i>Tableau de bord
        </a>
        }
        <a routerLink="/admin/commandes" routerLinkActive="!bg-brand-50 !text-brand-800"
           class="menu-item shrink-0 whitespace-nowrap">
          <i class="pi pi-shopping-bag menu-icon"></i>Commandes
        </a>
        <a routerLink="/admin/produits" routerLinkActive="!bg-brand-50 !text-brand-800"
           class="menu-item shrink-0 whitespace-nowrap">
          <i class="pi pi-box menu-icon"></i>Produits
        </a>
        <a routerLink="/admin/categories" routerLinkActive="!bg-brand-50 !text-brand-800"
           class="menu-item shrink-0 whitespace-nowrap">
          <i class="pi pi-tags menu-icon"></i>Catégories
        </a>
        <a routerLink="/admin/devis" routerLinkActive="!bg-brand-50 !text-brand-800"
           class="menu-item shrink-0 whitespace-nowrap">
          <i class="pi pi-file menu-icon"></i>Devis
        </a>
      </nav>
    </aside>

    <section class="min-w-0 flex-1">
      <router-outlet></router-outlet>
    </section>

  </div>
</div>
