<app-auth-layout title="Vos commandes et vos devis, au même endroit" [points]="points">

  <h1 class="auth-title">Connexion</h1>
  <p class="auth-lead">Accédez à votre espace KDLT Éditions.</p>

  <form class="auth-form" (ngSubmit)="onSubmit()" novalidate>

    @if (errorMessage) {
    <div class="alert-danger" role="alert">
      <i class="pi pi-exclamation-circle mt-0.5"></i>
      <span>{{ errorMessage }}</span>
    </div>
    }

    <div class="field">
      <label class="field-label" for="email">Adresse email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="vous@exemple.com"
             class="field-input" [class.border-danger]="fieldErrors['email']" [(ngModel)]="email">
      @if (fieldErrors['email']) {
      <p class="field-error">{{ fieldErrors['email'] }}</p>
      }
    </div>

    <div class="field">
      <label class="field-label" for="password">Mot de passe</label>
      <div class="relative">
        <input id="password" name="password" autocomplete="current-password"
               [type]="showPassword ? 'text' : 'password'"
               class="field-input pr-11" [class.border-danger]="fieldErrors['password']" [(ngModel)]="password">
        <button type="button" (click)="showPassword = !showPassword"
                class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-ink-3 hover:text-ink"
                [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
          <i class="pi" [class.pi-eye]="!showPassword" [class.pi-eye-slash]="showPassword"></i>
        </button>
      </div>
      @if (fieldErrors['password']) {
      <p class="field-error">{{ fieldErrors['password'] }}</p>
      }
    </div>

    <button type="submit" class="btn-primary btn-lg btn-block mt-1" [disabled]="submitting">
      {{ submitting ? 'Connexion en cours...' : 'Se connecter' }}
    </button>

  </form>

  <p class="auth-foot">
    Pas encore de compte ?
    <a routerLink="/auth/inscription" [queryParams]="returnUrl ? { returnUrl: returnUrl } : {}" class="link">Créer un compte</a>
  </p>

</app-auth-layout>
