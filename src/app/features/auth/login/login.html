<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <h1 class="text-2xl font-extrabold text-navy-900">Connexion</h1>
      <p class="text-slate-500 mt-2">Accédez à votre espace KDLT Éditions.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="bg-white rounded-3xl border border-slate-200 shadow-card p-8">

      <div *ngIf="errorMessage" class="mb-5 rounded-xl bg-red-50 border border-red-200 text-red-700 px-4 py-3 text-sm font-medium">
        {{ errorMessage }}
      </div>

      <label class="block text-sm font-semibold text-navy-700 mb-2">Email</label>
      <input type="email" name="email" [(ngModel)]="email" required
             class="w-full rounded-xl border border-slate-300 px-4 py-3 text-navy-900 focus:outline-none focus:ring-2 focus:ring-navy-400 mb-5"
             placeholder="vous@exemple.com"/>

      <label class="block text-sm font-semibold text-navy-700 mb-2">Mot de passe</label>
      <input type="password" name="password" [(ngModel)]="password" required
             class="w-full rounded-xl border border-slate-300 px-4 py-3 text-navy-900 focus:outline-none focus:ring-2 focus:ring-navy-400 mb-6"
             placeholder="••••••••"/>

      <button type="submit" [disabled]="submitting"
              class="w-full inline-flex items-center justify-center gap-2 bg-navy-800 hover:bg-navy-900 disabled:opacity-60 text-white font-bold px-6 py-3.5 rounded-2xl shadow-cta transition-colors">
        {{ submitting ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

  </div>
</div>
