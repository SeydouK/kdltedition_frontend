<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">

    <div *ngIf="checkingToken" class="text-center text-slate-400">
      Vérification de l'invitation...
    </div>

    <div *ngIf="!checkingToken && !tokenValid" class="text-center bg-white rounded-3xl border border-slate-200 shadow-card p-8">
      <h1 class="text-xl font-bold text-navy-900 mb-2">Invitation invalide</h1>
      <p class="text-slate-500">Ce lien d'invitation est invalide ou a expiré. Contactez l'administrateur pour en recevoir un nouveau.</p>
      <a routerLink="/" class="inline-block mt-6 text-navy-700 underline font-semibold">Retour à l'accueil</a>
    </div>

    <div *ngIf="!checkingToken && tokenValid">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-extrabold text-navy-900">Créer votre compte</h1>
        <p class="text-slate-500 mt-2">Vous avez été invité(e) à rejoindre KDLT Éditions.</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="bg-white rounded-3xl border border-slate-200 shadow-card p-8">

        <div *ngIf="errorMessage" class="mb-5 rounded-xl bg-red-50 border border-red-200 text-red-700 px-4 py-3 text-sm font-medium">
          {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="mb-5 rounded-xl bg-green-50 border border-green-200 text-green-700 px-4 py-3 text-sm font-medium">
          {{ successMessage }}
        </div>

        <div class="grid grid-cols-2 gap-4 mb-5">
          <div>
            <label class="block text-sm font-semibold text-navy-700 mb-2">Prénom</label>
            <input type="text" name="firstName" [(ngModel)]="firstName" required
                   class="w-full rounded-xl border border-slate-300 px-4 py-3 text-navy-900 focus:outline-none focus:ring-2 focus:ring-navy-400"/>
          </div>
          <div>
            <label class="block text-sm font-semibold text-navy-700 mb-2">Nom</label>
            <input type="text" name="lastName" [(ngModel)]="lastName" required
                   class="w-full rounded-xl border border-slate-300 px-4 py-3 text-navy-900 focus:outline-none focus:ring-2 focus:ring-navy-400"/>
          </div>
        </div>

        <label class="block text-sm font-semibold text-navy-700 mb-2">Email</label>
        <input type="email" name="email" [(ngModel)]="email" readonly
               class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-500 mb-5"/>

        <label class="block text-sm font-semibold text-navy-700 mb-2">Téléphone (facultatif)</label>
        <input type="tel" name="phoneNumber" [(ngModel)]="phoneNumber"
               class="w-full rounded-xl border border-slate-300 px-4 py-3 text-navy-900 focus:outline-none focus:ring-2 focus:ring-navy-400 mb-5"/>

        <label class="block text-sm font-semibold text-navy-700 mb-2">Mot de passe</label>
        <input type="password" name="password" [(ngModel)]="password" required
               class="w-full rounded-xl border border-slate-300 px-4 py-3 text-navy-900 focus:outline-none focus:ring-2 focus:ring-navy-400 mb-6"/>

        <button type="submit" [disabled]="submitting"
                class="w-full inline-flex items-center justify-center gap-2 bg-navy-800 hover:bg-navy-900 disabled:opacity-60 text-white font-bold px-6 py-3.5 rounded-2xl shadow-cta transition-colors">
          {{ submitting ? 'Création...' : 'Créer mon compte' }}
        </button>
      </form>
    </div>

  </div>
</div>
